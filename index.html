<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>هارون بلاست — نموذج تجريبي (تصميم متجر إلكتروني)</title>
<meta name="theme-color" content="#131921">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{scroll-behavior:smooth}
  body{
    font-family:"Segoe UI",Tahoma,"Noto Sans Arabic",Arial,sans-serif;
    background:#eef1f5;color:#131921;line-height:1.5;padding-bottom:76px;
  }
  :root{--nav:#131921;--nav2:#232f3e;--amber:#febd69;--cta:#ffd814;--blue:#007185;
        --line:#e3e6ea;--muted:#5a5f66;--wrap:1180px}

  /* ============ الترويسة ============ */
  header{position:sticky;top:0;z-index:50;background:var(--nav);box-shadow:0 2px 10px rgba(0,0,0,.28)}
  .hwrap{max-width:var(--wrap);margin:0 auto;padding:9px 12px}
  .hrow{display:flex;align-items:center;gap:10px}
  .logo{display:flex;align-items:center;gap:7px;background:#fff;padding:5px 9px;border-radius:8px;flex-shrink:0}
  .logo img{width:26px;height:26px;border-radius:5px;display:block}
  .logo b{font-size:13px;font-weight:800;letter-spacing:.4px;color:var(--nav)}
  .search{flex:1;display:flex;height:40px;border-radius:8px;overflow:hidden;background:#fff;min-width:0}
  .search input{flex:1;border:0;outline:0;padding:0 12px;font-size:14.5px;font-family:inherit;min-width:0}
  .search button{width:48px;border:0;background:var(--amber);cursor:pointer;font-size:18px;flex-shrink:0}
  .mainnav{display:none;gap:4px}
  .mainnav a{color:#e8edf5;text-decoration:none;font-size:13.5px;font-weight:700;padding:9px 12px;border-radius:7px;white-space:nowrap}
  .mainnav a:hover{background:var(--nav2);color:#fff}
  .mainnav a.on{color:var(--amber)}
  .cartbtn{position:relative;flex-shrink:0;background:none;border:0;cursor:pointer;font-size:21px;line-height:1;padding:4px}

  .badge{position:absolute;top:-2px;right:-4px;background:var(--amber);color:var(--nav);font-size:10.5px;font-weight:800;
         min-width:17px;height:17px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px}
  .cartwrap{display:none;align-items:center;gap:7px;background:var(--nav2);border:1px solid #3b4859;color:#fff;
            border-radius:8px;padding:7px 12px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;position:relative}

  /* ============ شرائح التصنيفات ============ */
  .chips{display:flex;gap:7px;overflow-x:auto;padding:9px 12px;background:#fff;border-bottom:1px solid var(--line);scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex-shrink:0;padding:6px 14px;border-radius:18px;border:1px solid var(--line);font-size:13px;font-weight:700;
        cursor:pointer;background:#fff;color:var(--nav);white-space:nowrap}
  .chip.on{background:var(--nav);color:#fff;border-color:var(--nav)}

  /* ============ المحتوى ============ */
  main{max-width:var(--wrap);margin:0 auto;padding:0 12px 24px}
  .hero{margin:12px 0;border-radius:12px;position:relative;overflow:hidden;
        background:linear-gradient(135deg,#101a2b 0%,#1e3050 60%,#2a4068 100%);color:#fff;padding:20px 18px}
  .hero .tagline{font-size:11.5px;color:var(--amber);font-weight:800;letter-spacing:.4px}
  .hero h2{font-size:20px;line-height:1.4;margin:4px 0 6px;font-weight:800}
  .hero p{font-size:13px;color:#bdcbe0;margin-bottom:13px}
  .hero .cta{align-self:flex-start;background:var(--cta);color:var(--nav);font-weight:800;border:0;border-radius:18px;
             padding:9px 20px;font-size:13.5px;cursor:pointer;font-family:inherit}
  .hero .blob{position:absolute;left:-40px;bottom:-50px;width:150px;height:150px;border-radius:50%;background:rgba(254,189,105,.14)}
  .hero .blob2{position:absolute;left:26px;top:-58px;width:96px;height:96px;border-radius:50%;background:rgba(255,255,255,.06)}

  .layout{display:block}
  .sidebar{display:none}
  .sechead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 2px 10px;flex-wrap:wrap}
  .sechead h3{font-size:17px;font-weight:800}
  .sechead span{font-size:12.5px;color:var(--blue);font-weight:700}
  .tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .sortbox{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);
           border-radius:9px;padding:5px 9px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .sortbox label{font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
  .sortbox select{border:0;outline:0;background:transparent;font-family:inherit;font-size:12.5px;
                  font-weight:800;color:var(--nav);cursor:pointer;padding:1px 2px;max-width:132px}
  .notice{background:#fff8e6;border:1px solid #f0dda6;border-radius:9px;padding:9px 12px;font-size:12px;color:#6b5310;margin-bottom:12px}

  /* ============ الشبكة ============ */
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 10px 11px;display:flex;flex-direction:column;position:relative}
  .thumb{width:100%;height:132px;border-radius:8px;background:#f5f7f9;display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:8px}
  .thumb img{max-width:100%;max-height:100%;object-fit:contain}
  .badge-out{position:absolute;top:8px;right:8px;background:var(--nav);color:#fff;font-size:10px;font-weight:800;padding:3px 7px;border-radius:5px}
  .cname{font-size:13px;font-weight:600;height:35px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.35;margin-bottom:4px}
  .cprice{font-size:19px;font-weight:800;white-space:nowrap;line-height:1.2}
  .avail{display:inline-block;font-size:11px;font-weight:800;padding:2px 8px;border-radius:10px;margin-bottom:5px;white-space:nowrap}
  .avail.on{background:#e7f6ec;color:#0f7b3d}
  .avail.off{background:#fdecec;color:#b3261e}
  .addbtn{width:100%;background:var(--cta);border:0;border-radius:16px;padding:8px 4px;font-size:12.5px;font-weight:800;
          cursor:pointer;font-family:inherit;color:var(--nav);white-space:nowrap;margin-top:auto;transition:filter .12s}
  .addbtn:active{filter:brightness(.92)}
  .addbtn:disabled{background:#e7eaee;color:#9aa3ad;cursor:not-allowed}

  /* ============ شريط الجوال ============ */
  .tabbar{position:fixed;bottom:0;right:0;left:0;max-width:520px;margin:0 auto;background:#fff;
          border-top:1px solid var(--line);display:flex;z-index:60;box-shadow:0 -2px 10px rgba(0,0,0,.08)}
  .tabbar button{flex:1;border:0;background:none;padding:7px 0 6px;cursor:pointer;font-family:inherit;font-size:10px;
                 color:var(--muted);font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px}
  .tabbar button.on{color:var(--blue)}
  .tabbar .ic{font-size:18px;line-height:1}

  /* ============ السلة ============ */
  .sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:80;display:none;align-items:flex-end;justify-content:center}
  .sheet.open{display:flex}
  .panel{background:#fff;width:100%;max-width:460px;border-radius:16px 16px 0 0;padding:16px 14px 20px;max-height:84vh;overflow-y:auto}
  .panel h3{font-size:16.5px;font-weight:800;margin-bottom:12px}
  .ci{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
  .ci img{width:48px;height:48px;object-fit:contain;background:#f5f7f9;border-radius:7px;flex-shrink:0}
  .ci .nm{flex:1;font-size:13px;font-weight:600;min-width:0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .ci .nm small{display:block;color:var(--muted);font-weight:700;direction:ltr;text-align:right}
  .ci .qty{display:flex;align-items:center;gap:8px;flex-shrink:0}
  .ci .qty button{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:15px;cursor:pointer;font-family:inherit;line-height:1}
  .ci .qty b{font-size:13.5px;min-width:14px;text-align:center}
  .total{display:flex;justify-content:space-between;font-weight:800;font-size:16.5px;margin:13px 0 11px}
  .checkout{width:100%;background:var(--cta);border:0;border-radius:20px;padding:13px;font-size:15.5px;font-weight:800;cursor:pointer;font-family:inherit}
  .empty{text-align:center;padding:24px 10px;color:var(--muted);font-size:13.5px}

  /* ================= لابتوب / كمبيوتر ================= */
  @media (min-width:768px){
    body{padding-bottom:0;background:#eef1f5}
    .hwrap{padding:10px 18px}
    .hrow{gap:16px}
    .search{height:44px}
    .search input{font-size:15px}
    .mainnav{display:flex;order:3}
    .cartwrap{display:flex;order:4}
    .cartbtn{display:none}
    .chips{padding:10px 18px}
    main{padding:0 18px 34px}
    .hero{margin:16px 0;padding:30px 30px;display:flex;flex-direction:column;justify-content:center;min-height:190px}
    .hero h2{font-size:28px}
    .hero p{font-size:14.5px}
    .hero .cta{font-size:15px;padding:11px 26px}
    .grid{grid-template-columns:repeat(3,1fr);gap:14px}
    .card{padding:12px}
    .thumb{height:168px}
    .cname{font-size:14px;height:38px}
    .cprice{font-size:21px}
    .addbtn{font-size:13.5px;padding:10px}
    .tabbar{display:none}
    /* السلة كدرج جانبي على الشاشات الكبيرة */
    .sheet{align-items:stretch;justify-content:flex-start}
    .panel{max-width:430px;height:100%;max-height:none;border-radius:0;margin-right:auto;margin-left:0;
           padding:22px 20px;animation:slide .22s ease}
    @keyframes slide{from{transform:translateX(30px);opacity:.4}to{transform:none;opacity:1}}
    .panel h3{font-size:19px}
    .ci img{width:58px;height:58px}
  }
  @media (min-width:1100px){
    .chips{display:none}          /* التصنيفات ظاهرة في القائمة الجانبية */
    .layout{display:flex;gap:20px;align-items:flex-start}
    .sidebar{display:block;flex:0 0 232px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;position:sticky;top:86px}
    .sidebar h4{font-size:14.5px;font-weight:800;margin-bottom:10px;padding-bottom:9px;border-bottom:1px solid var(--line)}
    .sidebar button{display:block;width:100%;text-align:right;border:0;background:none;cursor:pointer;font-family:inherit;
                    font-size:13.5px;font-weight:600;color:#333;padding:9px 10px;border-radius:8px}
    .sidebar button:hover{background:#f3f5f8}
    .sidebar button.on{background:var(--nav);color:#fff}
    .content{flex:1;min-width:0}
    .grid{grid-template-columns:repeat(4,1fr)}
    .thumb{height:186px}
  }
  @media (min-width:1500px){ .grid{grid-template-columns:repeat(5,1fr)} }
</style>
</head>
<body>

<header>
  <div class="hwrap">
    <div class="hrow">
      <div class="logo"><img src="icon.png" alt="هارون بلاست"><b>HAROUN</b></div>
      <div class="search">
        <input id="q" type="search" placeholder="ابحث عن منتج…">
        <button onclick="render()">🔍</button>
      </div>
      <nav class="mainnav">
        <a href="#" class="on" onclick="return false">الرئيسية</a>
        <a href="#" onclick="return toast('التصنيفات');return false">التصنيفات</a>
        <a href="#" onclick="return toast('الطلبات');return false">الطلبات</a>
        <a href="#" onclick="return toast('حسابي');return false">حسابي</a>
      </nav>
      <button class="cartbtn" onclick="openCart()">🛒<span class="badge" id="cnt">0</span></button>
      <button class="cartwrap" onclick="openCart()">🛒 السلة <span id="cnt2">0</span></button>
    </div>
  </div>
</header>

<div class="chips" id="chips"></div>

<main>
  <section class="hero">
    <div class="blob"></div><div class="blob2"></div>
    <span class="tagline">عرض خاص 🎉</span>
    <h2>منتجات البلاستيك المنزلي<br>بأسعار الجملة</h2>
    <p>اطلب من مكانك — توصيل لكل المحافظات</p>
    <button class="cta" onclick="document.getElementById('grid').scrollIntoView({behavior:'smooth'})">تسوّق الآن</button>
  </section>

  <div class="layout">
    <aside class="sidebar">
      <h4>التصنيفات</h4>
      <div id="sideCats"></div>
    </aside>

    <div class="content">
      <div class="sechead">
        <h3 id="gridTitle">كل المنتجات</h3>
        <div class="tools">
          <span id="count"></span>
          <div class="sortbox">
            <label for="sort">الفرز:</label>
            <select id="sort">
              <option value="new">الأحدث أولًا</option>
              <option value="price-asc">السعر: من الأقل</option>
              <option value="price-desc">السعر: من الأعلى</option>
              <option value="name-asc">الاسم: أ - ي</option>
              <option value="name-desc">الاسم: ي - أ</option>
              <option value="avail">المتوفر أولًا</option>
            </select>
          </div>
        </div>
      </div>
      <div class="notice">⚠️ نموذج تجريبي لعرض الشكل فقط — الطلب هنا لا يُرسل.</div>
      <div class="grid" id="grid"></div>
    </div>
  </div>
</main>

<div class="tabbar">
  <button class="on" onclick="toast('الرئيسية')"><span class="ic">🏠</span>الرئيسية</button>
  <button onclick="toast('التصنيفات')"><span class="ic">📂</span>التصنيفات</button>
  <button onclick="openCart()"><span class="ic">🛒</span>السلة</button>
  <button onclick="toast('الطلبات')"><span class="ic">📦</span>الطلبات</button>
  <button onclick="toast('حسابي')"><span class="ic">👤</span>حسابي</button>
</div>

<div class="sheet" id="cart"><div class="panel">
  <h3>سلة التسوق</h3>
  <div id="cartBody"></div>
  <div class="total"><span>المجموع</span><span id="sum">0.00 $</span></div>
  <button class="checkout" onclick="toast('إتمام الطلب')">إتمام الطلب</button>
</div></div>

<script>
const SUPA="https://kfiffvvrlnejthgoelcg.supabase.co";
const KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtmaWZmdnZybG5lanRoZ29lbGNnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk3NDA0NjIsImV4cCI6MjEwNTMxNjQ2Mn0.mRCFNImBclOg5Il7y08x9bPmeq0jTm1bvmOkBePAhQs";
const H={apikey:KEY,Authorization:"Bearer "+KEY};

let products=[],cats=[],cat=null,cart={};
const money=v=>"$"+Number(v||0).toFixed(2);
const isOut=p=>(p.stock||0)<=0;
const avail=p=>isOut(p)?'<div class="avail off">✕ غير متوفر</div>':'<div class="avail on">✓ متوفر</div>';
const pic=p=>p.image_url?`<img src="${p.image_url}" alt="${p.name}" loading="lazy">`:'<span style="font-size:30px">📦</span>';

async function load(){
  document.getElementById("grid").innerHTML='<div class="empty" style="grid-column:1/-1">جارٍ تحميل المنتجات…</div>';
  try{
    const get=async u=>{const r=await fetch(u,{headers:H});if(!r.ok)throw new Error(r.status);return r.json();};
    const [p,c]=await Promise.all([
      get(`${SUPA}/rest/v1/products?select=id,name,price,image_url,stock,is_active,categories(slug)&order=created_at.desc`),
      get(`${SUPA}/rest/v1/categories?select=id,name,slug&order=name`)
    ]);
    products=(p||[]).filter(x=>x.is_active!==false);
    cats=c||[];
    paintCats();
  }catch(e){
    document.getElementById("grid").innerHTML=
      '<div class="empty" style="grid-column:1/-1">⚠️ تعذّر تحميل المنتجات — تأكد من الإنترنت<br><br>'+
      '<button class="addbtn" style="max-width:200px;margin:0 auto" onclick="load()">🔄 إعادة المحاولة</button></div>';
    return;
  }
  render();
}

function paintCats(){
  document.getElementById("chips").innerHTML='<div class="chip on" data-s="">الكل</div>'+
    cats.map(c=>`<div class="chip" data-s="${c.slug}">${c.name}</div>`).join("");
  document.getElementById("sideCats").innerHTML=
    '<button class="on" data-s="">كل التصنيفات</button>'+
    cats.map(c=>`<button data-s="${c.slug}">${c.name}</button>`).join('');
  document.querySelectorAll("[data-s]").forEach(el=>el.onclick=()=>{
    cat=el.dataset.s||null;
    document.querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x.dataset.s===(cat||"")));
    document.querySelectorAll(".sidebar button").forEach(x=>x.classList.toggle("on",x.dataset.s===(cat||"")));
    render();
  });
}

function render(){
  const q=(document.getElementById("q").value||"").trim();
  const list=products.filter(p=>(!cat||p.categories?.slug===cat)&&(!q||p.name.includes(q)));
  const by={
    "price-asc":(a,b)=>(a.price||0)-(b.price||0),
    "price-desc":(a,b)=>(b.price||0)-(a.price||0),
    "name-asc":(a,b)=>a.name.localeCompare(b.name,"ar"),
    "name-desc":(a,b)=>b.name.localeCompare(a.name,"ar"),
    "avail":(a,b)=>(a.stock>0?0:1)-(b.stock>0?0:1)
  };
  const s=by[document.getElementById("sort").value];
  if(s) list.sort(s);
  document.getElementById("gridTitle").textContent=q?`نتائج البحث عن «${q}»`:"كل المنتجات";
  document.getElementById("count").textContent=`${list.length} منتج`;
  document.getElementById("grid").innerHTML=list.length?list.map(card).join("")
    :'<div class="empty" style="grid-column:1/-1">لا توجد منتجات مطابقة 🔍</div>';
  updateBadge();
}

function card(p){
  return `<div class="card">
    ${isOut(p)?'<span class="badge-out">غير متوفر</span>':''}
    <div class="thumb">${pic(p)}</div>
    <div class="cname">${p.name}</div>
    ${avail(p)}
    <div class="cprice">${money(p.price)}</div>
    <button class="addbtn" style="margin-top:9px" ${isOut(p)?'disabled':''} onclick="add('${p.id}',this)">
      ${isOut(p)?'غير متوفر':'＋ أضف إلى السلة'}</button>
  </div>`;
}

function add(id,el){
  cart[id]=(cart[id]||0)+1;updateBadge();
  const t=el.textContent;el.textContent="✔ تمت الإضافة";el.disabled=true;
  setTimeout(()=>{el.textContent=t;el.disabled=false;},1000);
}
function updateBadge(){
  const n=Object.values(cart).reduce((a,b)=>a+b,0);
  document.getElementById("cnt").textContent=n;
  document.getElementById("cnt2").textContent=n;
}
function openCart(){
  const b=document.getElementById("cartBody"),ids=Object.keys(cart);
  b.innerHTML=ids.length?ids.map(id=>{
    const p=products.find(x=>x.id===id);
    return `<div class="ci"><img src="${p.image_url||''}" alt="">
      <div class="nm">${p.name}<small>${money(p.price)}</small></div>
      <div class="qty"><button onclick="dec('${id}')">−</button><b>${cart[id]}</b><button onclick="inc('${id}')">＋</button></div>
    </div>`;}).join("")
    :'<div class="empty">السلة فاضية 🛒<br>أضف منتجات أولًا</div>';
  document.getElementById("sum").textContent=money(ids.reduce((s,id)=>s+products.find(x=>x.id===id).price*cart[id],0));
  document.getElementById("cart").classList.add("open");
}
function inc(id){cart[id]++;openCart();}
function dec(id){cart[id]--;if(cart[id]<=0)delete cart[id];openCart();}
document.getElementById("cart").onclick=e=>{if(e.target.id==="cart")document.getElementById("cart").classList.remove("open");};
function toast(t){alert(t+" — نموذج تجريبي");}
document.getElementById("q").addEventListener("input",render);
document.getElementById("sort").addEventListener("change",render);
load();
</script>
</body>
</html>

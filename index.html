<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>هارون بلاست — نموذج تجريبي (تصميم أمازون)</title>
<meta name="theme-color" content="#131921">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    font-family:"Segoe UI",Tahoma,"Noto Sans Arabic",Arial,sans-serif;
    background:#eef1f5;color:#131921;line-height:1.5;
    padding-bottom:74px;max-width:460px;margin:0 auto;min-height:100vh;
  }
  @media(min-width:900px){
    body{box-shadow:0 0 50px rgba(0,0,0,.16);background:#fff}
  }
  :root{--nav:#131921;--amber:#febd69;--cta:#ffd814;--blue:#007185;--line:#e3e6ea;--muted:#5a5f66}

  /* ===== الترويسة ===== */
  header{position:sticky;top:0;z-index:50;background:var(--nav);padding:9px 10px 10px;box-shadow:0 2px 10px rgba(0,0,0,.28)}
  .hrow{display:flex;align-items:center;gap:8px}
  .logo{display:flex;align-items:center;gap:6px;background:#fff;padding:4px 8px;border-radius:8px;flex-shrink:0}
  .logo img{width:24px;height:24px;border-radius:5px;display:block}
  .logo b{font-size:12px;font-weight:800;letter-spacing:.4px;color:#131921}
  .search{flex:1;display:flex;height:40px;border-radius:8px;overflow:hidden;background:#fff;min-width:0}
  .search input{flex:1;border:0;outline:0;padding:0 10px;font-size:14.5px;font-family:inherit;min-width:0;background:#fff}
  .search button{width:46px;border:0;background:var(--amber);cursor:pointer;font-size:18px;flex-shrink:0}
  .cartbtn{position:relative;flex-shrink:0;background:none;border:0;cursor:pointer;font-size:21px;line-height:1}
  .badge{position:absolute;top:-5px;right:-6px;background:var(--amber);color:#131921;font-size:10.5px;font-weight:800;
         min-width:17px;height:17px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px}

  /* ===== شرائح التصنيفات ===== */
  .chips{display:flex;gap:7px;overflow-x:auto;padding:9px 10px;background:#fff;border-bottom:1px solid var(--line);scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex-shrink:0;padding:6px 14px;border-radius:18px;border:1px solid var(--line);font-size:13px;font-weight:700;
        cursor:pointer;background:#fff;color:var(--nav);white-space:nowrap}
  .chip.on{background:var(--nav);color:#fff;border-color:var(--nav)}

  /* ===== بانر ===== */
  .hero{margin:12px 10px;border-radius:12px;position:relative;overflow:hidden;
        background:linear-gradient(135deg,#101a2b 0%,#1e3050 60%,#2a4068 100%);color:#fff;padding:18px 16px}
  .hero .tagline{font-size:11.5px;color:var(--amber);font-weight:800;letter-spacing:.4px}
  .hero h2{font-size:19px;line-height:1.4;margin:4px 0 6px;font-weight:800}
  .hero p{font-size:12.5px;color:#bdcbe0;margin-bottom:12px}
  .hero .cta{align-self:flex-start;background:var(--cta);color:#131921;font-weight:800;border:0;border-radius:18px;
             padding:8px 18px;font-size:13.5px;cursor:pointer;font-family:inherit}
  .hero .blob{position:absolute;left:-38px;bottom:-46px;width:140px;height:140px;border-radius:50%;background:rgba(254,189,105,.14)}
  .hero .blob2{position:absolute;left:22px;top:-56px;width:92px;height:92px;border-radius:50%;background:rgba(255,255,255,.06)}

  /* ===== العناوين ===== */
  .sechead{display:flex;align-items:baseline;justify-content:space-between;padding:14px 12px 8px}
  .sechead h3{font-size:16.5px;font-weight:800}
  .sechead span{font-size:12.5px;color:var(--blue);font-weight:700}

  /* ===== صف أفقي ===== */
  .row{display:flex;gap:9px;overflow-x:auto;padding:0 12px 4px;scrollbar-width:none;scroll-snap-type:x proximity}
  .row::-webkit-scrollbar{display:none}
  .rcard{flex:0 0 148px;scroll-snap-align:start;background:#fff;border:1px solid var(--line);border-radius:10px;
         padding:9px 9px 10px;display:flex;flex-direction:column}
  .thumb{width:100%;height:112px;border-radius:8px;background:#f5f7f9;display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:8px}
  .thumb img{max-width:100%;max-height:100%;object-fit:contain}
  .rname{font-size:12.5px;font-weight:600;height:34px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.35}
  .rprice{font-size:17px;font-weight:800;margin:5px 0 7px;white-space:nowrap}

  /* ===== شارات ===== */
  .avail{display:inline-block;font-size:11px;font-weight:800;padding:2px 8px;border-radius:10px;margin-bottom:5px;white-space:nowrap}
  .avail.on{background:#e7f6ec;color:#0f7b3d}
  .avail.off{background:#fdecec;color:#b3261e}

  /* ===== أزرار ===== */
  .addbtn{width:100%;background:var(--cta);border:0;border-radius:16px;padding:8px 4px;font-size:12.5px;font-weight:800;
          cursor:pointer;font-family:inherit;color:#131921;white-space:nowrap;margin-top:auto;transition:filter .12s}
  .addbtn:active{filter:brightness(.92)}
  .addbtn:disabled{background:#e7eaee;color:#9aa3ad;cursor:not-allowed}
  .addbtn.mini{padding:6px 4px;font-size:12px}

  /* ===== الشبكة ===== */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 12px}
  .card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 10px 11px;display:flex;flex-direction:column;position:relative}
  .card .thumb{height:138px}
  .badge-out{position:absolute;top:8px;right:8px;background:var(--nav);color:#fff;font-size:10px;font-weight:800;padding:3px 7px;border-radius:5px}
  .cname{font-size:13px;font-weight:600;height:35px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.35;margin-bottom:4px}
  .cprice{font-size:19px;font-weight:800;white-space:nowrap;line-height:1.2}

  .notice{margin:10px 12px 0;background:#fff8e6;border:1px solid #f0dda6;border-radius:9px;padding:9px 12px;font-size:12px;color:#6b5310}

  /* ===== شريط التنقل ===== */
  .tabbar{position:fixed;bottom:0;right:0;left:0;max-width:460px;margin:0 auto;background:#fff;border-top:1px solid var(--line);display:flex;z-index:60;box-shadow:0 -2px 10px rgba(0,0,0,.08)}
  .tabbar button{flex:1;border:0;background:none;padding:7px 0 6px;cursor:pointer;font-family:inherit;font-size:10px;color:var(--muted);
                 font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px}
  .tabbar button.on{color:var(--blue)}
  .tabbar .ic{font-size:18px;line-height:1}

  /* ===== لوحة السلة ===== */
  .sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:80;display:none;align-items:flex-end;justify-content:center}
  .sheet.open{display:flex}
  .panel{background:#fff;width:100%;max-width:460px;border-radius:16px 16px 0 0;padding:16px 14px 20px;max-height:82vh;overflow-y:auto}
  .panel h3{font-size:16.5px;font-weight:800;margin-bottom:12px}
  .ci{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
  .ci img{width:48px;height:48px;object-fit:contain;background:#f5f7f9;border-radius:7px;flex-shrink:0}
  .ci .nm{flex:1;font-size:13px;font-weight:600;min-width:0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .ci .nm small{display:block;color:var(--muted);font-weight:700;direction:ltr;text-align:right}
  .ci .qty{display:flex;align-items:center;gap:8px;flex-shrink:0}
  .ci .qty button{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:15px;cursor:pointer;font-family:inherit;line-height:1}
  .ci .qty b{font-size:13.5px;min-width:14px;text-align:center}
  .total{display:flex;justify-content:space-between;font-weight:800;font-size:16.5px;margin:13px 0 11px}
  .checkout{width:100%;background:var(--cta);border:0;border-radius:20px;padding:13px;font-size:15.5px;font-weight:800;cursor:pointer;font-family:inherit}
  .empty{text-align:center;padding:24px 10px;color:var(--muted);font-size:13.5px}
</style>
</head>
<body>

<header>
  <div class="hrow">
    <div class="logo"><img src="icon.png" alt="هارون بلاست"><b>HAROUN</b></div>
    <div class="search">
      <input id="q" type="search" placeholder="ابحث عن منتج…">
      <button onclick="render()">🔍</button>
    </div>
    <button class="cartbtn" onclick="openCart()">🛒<span class="badge" id="cnt">0</span></button>
  </div>
</header>

<div class="chips" id="chips"></div>

<div class="hero">
  <div class="blob"></div><div class="blob2"></div>
  <span class="tagline">عرض خاص 🎉</span>
  <h2>منتجات البلاستيك المنزلي<br>بأسعار الجملة</h2>
  <p>اطلب من مكانك — توصيل لكل المحافظات</p>
  <button class="cta" onclick="document.getElementById('grid').scrollIntoView({behavior:'smooth'})">تسوّق الآن</button>
</div>

<div class="sechead"><h3>الأكثر طلبًا 🔥</h3><span>عرض الكل ←</span></div>
<div class="row" id="topRow"></div>

<div class="sechead"><h3 id="gridTitle">كل المنتجات</h3><span>الأحدث أولًا</span></div>
<div class="notice">⚠️ نموذج تجريبي لعرض الشكل فقط — الطلب هنا لا يُرسل.</div>
<div class="grid" id="grid"></div>

<div class="tabbar">
  <button class="on" onclick="toast('الرئيسية')"><span class="ic">🏠</span>الرئيسية</button>
  <button onclick="toast('التصنيفات')"><span class="ic">📂</span>التصنيفات</button>
  <button onclick="openCart()"><span class="ic">🛒</span>السلة</button>
  <button onclick="toast('الطلبات')"><span class="ic">📦</span>الطلبات</button>
  <button onclick="toast('حسابي')"><span class="ic">👤</span>حسابي</button>
</div>

<div class="sheet" id="cart"><div class="panel">
  <h3>سلة التسوق</h3>
  <div id="cartBody"></div>
  <div class="total"><span>المجموع</span><span id="sum">0.00 $</span></div>
  <button class="checkout">إتمام الطلب</button>
</div></div>

<script>
const SUPA="https://kfiffvvrlnejthgoelcg.supabase.co";
const KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtmaWZmdnZybG5lanRoZ29lbGNnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk3NDA0NjIsImV4cCI6MjEwNTMxNjQ2Mn0.mRCFNImBclOg5Il7y08x9bPmeq0jTm1bvmOkBePAhQs";
const H={apikey:KEY,Authorization:"Bearer "+KEY};

let products=[],cats=[],cat=null,cart={};
const money=v=>"$"+Number(v||0).toFixed(2);
const isOut=p=>(p.stock||0)<=0;
const avail=p=>isOut(p)?'<div class="avail off">✕ غير متوفر</div>':'<div class="avail on">✓ متوفر</div>';
const pic=p=>p.image_url?`<img src="${p.image_url}" alt="${p.name}" loading="lazy">`:'<span style="font-size:30px">📦</span>';

async function load(){
  document.getElementById("grid").innerHTML='<div class="empty" style="grid-column:1/-1">جارٍ تحميل المنتجات…</div>';
  try{
    const get=async u=>{const r=await fetch(u,{headers:H});if(!r.ok)throw new Error(r.status);return r.json();};
    const [p,c]=await Promise.all([
      get(`${SUPA}/rest/v1/products?select=id,name,price,image_url,stock,is_active,categories(slug)&order=created_at.desc`),
      get(`${SUPA}/rest/v1/categories?select=id,name,slug&order=name`)
    ]);
    products=(p||[]).filter(x=>x.is_active!==false);
    cats=c||[];
    document.getElementById("chips").innerHTML='<div class="chip on" data-s="">الكل</div>'+
      cats.map(c=>`<div class="chip" data-s="${c.slug}">${c.name}</div>`).join("");
    document.querySelectorAll(".chip").forEach(el=>el.onclick=()=>{
      document.querySelectorAll(".chip").forEach(x=>x.classList.remove("on"));
      el.classList.add("on");cat=el.dataset.s||null;render();});
  }catch(e){
    document.getElementById("grid").innerHTML=
      '<div class="empty" style="grid-column:1/-1">⚠️ تعذّر تحميل المنتجات — تأكد من الإنترنت<br><br>'+
      '<button class="addbtn mini" style="max-width:200px;margin:0 auto" onclick="load()">🔄 إعادة المحاولة</button></div>';
    document.getElementById("topRow").innerHTML="";
    return;
  }
  render();
}

function render(){
  const q=(document.getElementById("q").value||"").trim();
  const list=products.filter(p=>(!cat||p.categories?.slug===cat)&&(!q||p.name.includes(q)));
  document.getElementById("topRow").innerHTML=[...products].slice(0,8).map(rowCard).join("");
  document.getElementById("gridTitle").textContent=q?`نتائج البحث (${list.length})`:"كل المنتجات";
  document.getElementById("grid").innerHTML=list.length?list.map(gridCard).join("")
    :'<div class="empty" style="grid-column:1/-1">لا توجد منتجات مطابقة 🔍</div>';
  updateBadge();
}

function rowCard(p){
  return `<div class="rcard">
    <div class="thumb">${pic(p)}</div>
    <div class="rname">${p.name}</div>
    ${avail(p)}
    <div class="rprice">${money(p.price)}</div>
    <button class="addbtn mini" ${isOut(p)?'disabled':''} onclick="add('${p.id}',this)">${isOut(p)?'غير متوفر':'＋ أضف'}</button>
  </div>`;
}

function gridCard(p){
  return `<div class="card">
    ${isOut(p)?'<span class="badge-out">غير متوفر</span>':''}
    <div class="thumb">${pic(p)}</div>
    <div class="cname">${p.name}</div>
    ${avail(p)}
    <div class="cprice">${money(p.price)}</div>
    <button class="addbtn" style="margin-top:9px" ${isOut(p)?'disabled':''} onclick="add('${p.id}',this)">${isOut(p)?'غير متوفر':'＋ أضف إلى السلة'}</button>
  </div>`;
}

function add(id,el){
  cart[id]=(cart[id]||0)+1;updateBadge();
  const t=el.textContent;el.textContent="✔ تمت";el.disabled=true;
  setTimeout(()=>{el.textContent=t;el.disabled=false;},1000);
}
function updateBadge(){document.getElementById("cnt").textContent=Object.values(cart).reduce((a,b)=>a+b,0);}
function openCart(){
  const b=document.getElementById("cartBody"),ids=Object.keys(cart);
  b.innerHTML=ids.length?ids.map(id=>{
    const p=products.find(x=>x.id===id);
    return `<div class="ci"><img src="${p.image_url||''}" alt="">
      <div class="nm">${p.name}<small>${money(p.price)}</small></div>
      <div class="qty"><button onclick="dec('${id}')">−</button><b>${cart[id]}</b><button onclick="inc('${id}')">＋</button></div>
    </div>`;}).join("")
    :'<div class="empty">السلة فاضية 🛒<br>أضف منتجات أولًا</div>';
  document.getElementById("sum").textContent=money(ids.reduce((s,id)=>s+products.find(x=>x.id===id).price*cart[id],0));
  document.getElementById("cart").classList.add("open");
}
function inc(id){cart[id]++;openCart();}
function dec(id){cart[id]--;if(cart[id]<=0)delete cart[id];openCart();}
document.getElementById("cart").onclick=e=>{if(e.target.id==="cart")document.getElementById("cart").classList.remove("open");};
function toast(t){alert(t+" — نموذج تجريبي");}
document.getElementById("q").addEventListener("input",render);
load();
</script>
</body>
</html>
